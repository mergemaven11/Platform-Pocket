name: Platform Pocket v0.8 Workstation Integration

on:
  push:
    branches: [feature/pocket-workstation]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply workstation integration
        run: python scripts/integrate_workstation_v08.py
      - name: Verify expected wiring
        run: |
          grep -q 'APP_VERSION = "0.8"' src/main.cpp
          grep -q 'SCREEN_EDITOR' src/main.cpp
          grep -q 'PocketWorkstation::compareSnapshots' src/main.cpp
          grep -q 'PocketWorkstation::troubleshoot' src/main.cpp
      - name: Commit generated integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'feat: integrate Platform Pocket v0.8 workstation UX'
          git push
