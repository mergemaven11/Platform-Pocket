name: Apply v0.9 production ops pack

on:
  push:
    branches:
      - feat/v0.9-production-ops

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.9-production-ops
          fetch-depth: 0

      - name: Apply v0.9 patch
        run: python3 scripts/apply_v09_ops_pack.py

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp src/workstation.cpp README.md
          git commit -m "feat: add Platform Pocket v0.9 production ops pack"
          git push origin HEAD:feat/v0.9-production-ops
