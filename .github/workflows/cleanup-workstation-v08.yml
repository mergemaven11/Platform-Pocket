name: Clean Platform Pocket v0.8 Integration

on:
  push:
    branches: [feature/pocket-workstation]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean repeated generated wiring
        run: python scripts/cleanup_workstation_v08.py
      - name: Sanity check generated source
        run: |
          test "$(grep -c '#include \"workstation.h\"' src/main.cpp)" -eq 1
          test "$(grep -c 'void drawEditor()' src/main.cpp)" -eq 1
          test "$(grep -c 'void openEditor()' src/main.cpp)" -eq 1
          grep -q 'APP_VERSION = "0.8"' src/main.cpp
      - name: Commit cleaned firmware
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'fix: clean v0.8 workstation integration'
          git push
