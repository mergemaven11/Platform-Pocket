name: Platform Pocket SD Workspace Upgrade

on:
  push:
    branches:
      - feature/sd-workspace
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sd-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v0.7 SD workspace integration
        run: |
          if grep -q 'APP_VERSION = "0.7"' src/main.cpp; then
            echo "v0.7 integration already applied."
          else
            python scripts/apply_sd_workspace.py
          fi
      - name: Verify persistence wiring
        run: |
          grep -q '#include "storage.h"' src/main.cpp
          grep -q 'PocketStorage::begin' src/main.cpp
          grep -q 'PocketStorage::appendQuickNote' src/main.cpp
          grep -q 'PocketStorage::saveDiagnosticSnapshot' src/main.cpp
          grep -q 'PocketStorage::statusText' src/main.cpp
      - name: Commit generated firmware integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp
          if git diff --cached --quiet; then
            echo "Firmware integration already committed."
            exit 0
          fi
          git commit -m "feat: wire SD workspace into Platform Pocket v0.7"
          git push origin HEAD:feature/sd-workspace
