name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches firmware version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          expected = tag[1:] if tag.startswith('v') else tag
          source = Path('src/main.cpp').read_text()
          match = re.search(r'APP_VERSION\s*=\s*"([^"]+)"', source)
          if not match:
              raise SystemExit('APP_VERSION was not found in src/main.cpp')
          actual = match.group(1)
          print(f'release tag version: {expected}')
          print(f'firmware APP_VERSION: {actual}')
          if actual != expected:
              raise SystemExit(f'tag/version mismatch: tag={expected}, firmware={actual}')
          PY

      - name: Install pinned PlatformIO
        run: pip install platformio==6.2.0

      - name: Build release firmware
        run: pio run -e cardputer-adv

      - name: Run native tests
        run: pio test -e native

      - name: Package release binaries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .pio/build/cardputer-adv/firmware.bin "dist/platform-pocket-${RELEASE_TAG}-firmware.bin"
          cp .pio/build/cardputer-adv/bootloader.bin "dist/platform-pocket-${RELEASE_TAG}-bootloader.bin"
          cp .pio/build/cardputer-adv/partitions.bin "dist/platform-pocket-${RELEASE_TAG}-partitions.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Platform Pocket ${{ github.ref_name }}"
