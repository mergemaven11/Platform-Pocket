name: Update Platform Pocket v0.7 Feature Catalog

on:
  push:
    branches:
      - feature/sd-workspace
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sd-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update feature catalog
        run: |
          if grep -q 'Available in v0.7' docs/FEATURES.md; then
            echo "Feature catalog already updated."
          else
            python scripts/update_features_v07.py
          fi
      - name: Verify v0.7 storage docs
        run: |
          grep -q '### `sd` — ✅ Available' docs/FEATURES.md
          grep -q '### `snapshot` — ✅ Available' docs/FEATURES.md
          grep -q '### View Notes — ✅ Available' docs/FEATURES.md
          grep -q '### SD Storage — ✅ Available' docs/FEATURES.md
      - name: Commit feature catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURES.md
          if git diff --cached --quiet; then
            echo "Feature catalog already committed."
            exit 0
          fi
          git commit -m "docs: update feature catalog for Platform Pocket v0.7"
          git push origin HEAD:feature/sd-workspace
