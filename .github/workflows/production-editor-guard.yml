name: Apply production editor save guard

on:
  push:
    branches:
      - feat/v0.9-production-ops

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/v0.9-production-ops

      - name: Apply editor save guard
        run: python scripts/apply_production_editor_guard.py

      - name: Commit generated fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp
          git commit -m "fix: preserve unsaved editor buffer on save failure"
          git push
