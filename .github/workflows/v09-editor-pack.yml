name: Apply v0.9 text editor upgrade

on:
  push:
    branches:
      - feat/v0.9-production-ops

permissions:
  contents: write

jobs:
  apply-editor-pack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.9-production-ops

      - name: Apply editor upgrade
        run: python scripts/apply_v09_editor_pack.py

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp src/workstation.h src/workstation.cpp README.md docs/PRODUCTION_OPS.md
          git commit -m "feat: upgrade Platform Pocket text editor"
          git push
