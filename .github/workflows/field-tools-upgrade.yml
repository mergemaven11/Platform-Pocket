name: Platform Pocket Field Tools Upgrade

on:
  push:
    branches:
      - feature/platform-pocket-field-tools
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-pocket-field-tools
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply field-tools upgrade
        run: python scripts/upgrade_field_tools.py
      - name: Prevent placeholder regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/main.cpp').read_text(encoding='utf-8')
          retired = [
              'Live RSSI graph is queued',
              'SHA-256 text/file hashing\\nis planned',
              'Defensive port checks for\\nhosts you own/administer\\nare planned',
              'Calculator is queued',
              'Decimal / binary / hex\\nconversion is queued',
              'Internal flash + SD status\\nwill live here',
          ]
          found = [text for text in retired if text in source]
          if found:
              raise SystemExit('Retired placeholders remain: ' + repr(found))
          required = ['dns ', 'port ', 'sha256 ', 'cidr ', 'base ', 'diag', 'showSignalMonitor', 'showStorageInfo']
          missing = [text for text in required if text not in source]
          if missing:
              raise SystemExit('Missing field tools: ' + repr(missing))
          print('Field-tools source verification passed.')
          PY
      - name: Commit generated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp
          if git diff --cached --quiet; then
            echo "Field tools already applied."
            exit 0
          fi
          git commit -m "feat: add on-device field diagnostics and shell tools"
          git push origin HEAD:feature/platform-pocket-field-tools
