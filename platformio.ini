; Platform Pocket production build configuration
;
; Keep toolchain and library versions pinned so release builds are reproducible.
; Override upload_port locally if PlatformIO cannot auto-detect your Cardputer ADV.

[env:cardputer-adv]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
build_type = release

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28

[env:native]
platform = native@1.2.1
test_framework = unity
test_filter = test_core
